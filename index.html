<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>EcoVento Dashboard</title>
</head>
<body>
  <h1>Painel EcoVento</h1>
  <div id="dados">A carregar dados do servidor...</div>

  <script>
    fetch('https://ecovento-backend.onrender.com/api/status')
      .then(res => res.json())
      .then(data => {
        document.getElementById('dados').innerHTML = `
          <p><strong>Empresa:</strong> ${data.empresa}</p>
          <p><strong>Estado:</strong> ${data.estado}</p>
          <p><strong>Parques Eólicos:</strong> ${data.parquesEolicos}</p>
        `;
      })
      .catch(err => {
        document.getElementById('dados').innerText = 'Servidor a acordar ou erro de ligação. Aguarde alguns segundos e atualize a página.';
      });
  </script>
</body>
</html>
