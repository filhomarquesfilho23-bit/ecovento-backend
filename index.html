<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVento - Painel de Controlo</title>
  <style>
    :root {
      --primary: #059669;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #10b981; font-size: 1.8rem; text-align: center; }
    .status-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .card h3 { margin-top: 0; color: #38bdf8; }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 EcoVento Dashboard</h1>
    
    <div class="card" id="geral">
      <h3>Estado Geral</h3>
      <p id="empresa">A acordar servidor (pode demorar ~45s)...</p>
      <div id="badge-container"><span class="status-badge" style="background: rgba(234, 179, 8, 0.2); color: #facc15;">● A aguardar...</span></div>
    </div>

    <h2>Parques Eólicos</h2>
    <div class="grid" id="parques">
      <div class="card"><p>A carregar parques...</p></div>
    </div>

    <button onclick="carregarDados()">🔄 Forçar Atualização</button>
  </div>

  <script>
    const API_URL = 'https://ecovento-backend.onrender.com';

    async function carregarDados() {
      const empresaEl = document.getElementById('empresa');
      const badgeContainer = document.getElementById('badge-container');
      const parquesContainer = document.getElementById('parques');

      empresaEl.innerText = 'A acordar o servidor no Render (por favor aguarde)...';
      badgeContainer.innerHTML = '<span class="status-badge" style="background: rgba(234, 179, 8, 0.2); color: #facc15;">● A ligar...</span>';

      let sucesso = false;
      let tentativas = 0;
      const maxTentativas = 15; // Tenta durante cerca de 1 minuto

      while (!sucesso && tentativas < maxTentativas) {
        tentativas++;
        try {
          // 1. Tenta carregar o estado geral
          const resStatus = await fetch(`${API_URL}/api/status`);
          if (!resStatus.ok) throw new Error('Servidor a iniciar');
          const data = await resStatus.json();

          empresaEl.innerText = data.empresa;
          badgeContainer.innerHTML = `
            <span class="status-badge">● ${data.estado}</span>
            <p><strong>Parques Ativos:</strong> ${data.parquesEolicos} | <strong>Eficiência:</strong> ${data.eficienciaGlobal}</p>
          `;

          // 2. Tenta carregar os parques eólicos
          const resParques = await fetch(`${API_URL}/api/parques`);
          if (resParques.ok) {
            const parques = await resParques.json();
            parquesContainer.innerHTML = '';
            parques.forEach(p => {
              parquesContainer.innerHTML += `
                <div class="card">
                  <h3>${p.nome}</h3>
                  <p><strong>Potência:</strong> ${p.potenciaMW} MW</p>
                  <p><strong>Estado:</strong> ${p.estado}</p>
                </div>
              `;
            });
          }

          sucesso = true; // Dados carregados com sucesso!
        } catch (err) {
          // Se falhar, espera 4 segundos e tenta de novo automaticamente
          await new Promise(resolve => setTimeout(resolve, 4000));
        }
      }

      if (!sucesso) {
        empresaEl.innerText = 'O servidor demorou a responder. Toque em "Forçar Atualização".';
        badgeContainer.innerHTML = '';
      }
    }

    // Iniciar automaticamente ao abrir a página
    carregarDados();
  </script>
</body>
</html>
